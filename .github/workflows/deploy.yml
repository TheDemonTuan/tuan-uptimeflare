name: Build Cloudflare release

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Use Node.js 24.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.0.2
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix worker ci
      - name: Verify application
        run: |
          npm run typecheck
          npm run lint
          npm run check
          bun test tests/monitoring.test.ts
          python3 -m unittest discover -s deploy/tests -p 'test_package_release.py' -v
      - name: Compile monitoring Worker without credentials
        run: npm --prefix worker run build
      - name: Build OpenNext once and compile runtime modules
        run: |
          npm run build:worker
          node node_modules/wrangler/bin/wrangler.js deploy --dry-run --outdir web/dist
      - name: Package immutable release
        run: python3 deploy/package_release.py --sha "$GITHUB_SHA" --output "$RUNNER_TEMP/cloudflare-release"
      - name: Exercise packaged Cloudflare runtime without credentials
        run: npm run check:runtime -- "$RUNNER_TEMP/cloudflare-release"
      - name: Upload central deployment input
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloudflare-uptimeflare-${{ github.sha }}
          path: ${{ runner.temp }}/cloudflare-release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
