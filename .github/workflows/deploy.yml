name: Build Cloudflare release

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix worker ci
      - name: Verify application
        run: |
          npm run typecheck
          npm run lint
          npm run check
          bun test tests/monitoring.test.ts
          python3 -m unittest discover -s deploy/tests -p 'test_package_release.py' -v
      - name: Compile monitoring Worker without credentials
        run: npm --prefix worker run build
      - name: Build OpenNext once and compile runtime modules
        run: |
          npm run build:worker
          node node_modules/wrangler/bin/wrangler.js deploy --dry-run --outdir web/dist
      - name: Package immutable release
        run: python3 deploy/package_release.py --sha "$GITHUB_SHA" --output "$RUNNER_TEMP/cloudflare-release"
      - name: Upload central deployment input
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-uptimeflare-${{ github.sha }}
          path: ${{ runner.temp }}/cloudflare-release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
