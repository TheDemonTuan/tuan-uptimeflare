name: Deploy to Cloudflare

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: pip install requests

      - name: Fetch Account ID
        id: fetch_account_id
        run: |
          if [ -n "$CLOUDFLARE_ACCOUNT_ID_INPUT" ]; then
            ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID_INPUT"
          else
            RESP=$(curl -sS -f "https://api.cloudflare.com/client/v4/accounts" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
            COUNT=$(echo "$RESP" | jq '.result | length')
            if [ "$COUNT" -ne 1 ]; then
              echo "Expected exactly 1 Cloudflare account for token, found $COUNT. Set CLOUDFLARE_ACCOUNT_ID secret."
              exit 1
            fi
            ACCOUNT_ID=$(echo "$RESP" | jq -r '.result[0].id')
          fi
          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID_INPUT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Install packages
        run: |
          npm ci
          npm --prefix worker ci

      - name: Build monitoring worker
        run: npm --prefix worker run deploy -- --dry-run --outdir dist

      - name: Create or resolve D1 database
        run: python3 deploy/init_d1.py
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.fetch_account_id.outputs.account_id }}

      - name: Inject production D1 ID into local workspace configs
        run: |
          sed -i "s/database_id = \"00000000-0000-0000-0000-000000000000\"/database_id = \"$D1_ID\"/g" wrangler.toml worker/wrangler.toml
        env:
          D1_ID: ${{ env.D1_ID }}

      - name: Deploy infrastructure with Terraform
        run: |
          terraform init
          DO_RESP=$(curl -sS -f "https://api.cloudflare.com/client/v4/accounts/$TF_VAR_CLOUDFLARE_ACCOUNT_ID/workers/durable_objects/namespaces?per_page=1000" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          if echo "$DO_RESP" | jq -e '.result[] | select(.script == "uptimeflare_worker" and .class == "RemoteChecker")' > /dev/null; then
            echo "Existing RemoteChecker DO namespace found."
          else
            echo "Enabling DO migration flag."
            export TF_VAR_enable_do_migration=true
          fi

          import_resource() {
            local res="$1"
            local id="$2"
            local check_url="$3"
            local status
            status=$(curl -s -o /dev/null -w "%{http_code}" "$check_url" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
            if [ "$status" = "200" ]; then
              terraform import "$res" "$id"
            elif [ "$status" = "404" ]; then
              echo "$res does not exist yet; will create."
            else
              echo "Failed to verify $res (HTTP $status)"
              exit 1
            fi
          }

          import_resource "cloudflare_d1_database.uptimeflare_d1" "$TF_VAR_CLOUDFLARE_ACCOUNT_ID/$D1_ID" "https://api.cloudflare.com/client/v4/accounts/$TF_VAR_CLOUDFLARE_ACCOUNT_ID/d1/database/$D1_ID"
          import_resource "cloudflare_workers_script.uptimeflare_worker" "$TF_VAR_CLOUDFLARE_ACCOUNT_ID/uptimeflare_worker" "https://api.cloudflare.com/client/v4/accounts/$TF_VAR_CLOUDFLARE_ACCOUNT_ID/workers/scripts/uptimeflare_worker"
          import_resource "cloudflare_workers_cron_trigger.uptimeflare_worker_cron" "$TF_VAR_CLOUDFLARE_ACCOUNT_ID/uptimeflare_worker" "https://api.cloudflare.com/client/v4/accounts/$TF_VAR_CLOUDFLARE_ACCOUNT_ID/workers/scripts/uptimeflare_worker/schedules"

          terraform plan -out=tfplan.binary -input=false
          terraform show -json tfplan.binary > tfplan.json
          python3 -c '
import json, sys
plan = json.load(open("tfplan.json"))
forbidden = {"delete", "replace"}
for rc in plan.get("resource_changes", []):
    actions = set(rc.get("change", {}).get("actions", []))
    if actions & forbidden:
        print(f"FORBIDDEN DESTRUCTIVE ACTION on {rc.get(\"address\")}: {actions}", file=sys.stderr)
        sys.exit(1)
print("Plan validated: no destructive changes to monitoring infrastructure.")
'
          terraform apply -auto-approve -input=false tfplan.binary
          rm -f tfplan.binary tfplan.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_CLOUDFLARE_ACCOUNT_ID: ${{ steps.fetch_account_id.outputs.account_id }}
          D1_ID: ${{ env.D1_ID }}
          TF_VAR_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TF_VAR_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Build and deploy web worker
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.fetch_account_id.outputs.account_id }}
