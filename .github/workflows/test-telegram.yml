name: Test Telegram notification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-test:
    runs-on: ubuntu-latest
    steps:
      - name: Send test notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node --input-type=module - <<'JS'
          const { TELEGRAM_BOT_TOKEN: token, TELEGRAM_CHAT_ID: chat } = process.env;
          if (!token || !chat) throw new Error('Telegram secrets missing');
          const response = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({ chat_id: chat, text: 'UptimeFlare: test notification after token rotation' }),
            signal: AbortSignal.timeout(5000),
          });
          const result = await response.json();
          if (!response.ok || !result.ok || String(result.result?.chat?.id) !== chat)
            throw new Error(`Telegram delivery failed (HTTP ${response.status})`);
          console.log('Telegram test notification delivered');
          JS
