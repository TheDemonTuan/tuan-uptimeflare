name: Seal existing deploy credentials for vps-deploy
on:
  push:
    branches: [feat/central-cloudflare-artifacts]
    paths: [.github/workflows/centralize-deploy-secrets.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install sealed-box encryption dependency
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y python3-nacl
      - name: Encrypt existing values to the destination GitHub secret public key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          BESZEL_ACCESS_CLIENT_ID: ${{ secrets.BESZEL_ACCESS_CLIENT_ID }}
          BESZEL_ACCESS_CLIENT_SECRET: ${{ secrets.BESZEL_ACCESS_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          /usr/bin/python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          from nacl.public import PublicKey, SealedBox
          recipient='TheDemonTuan/vps-deploy'
          key_id='3380204578043523366'
          public_key='xBL0orX9Eesrqj5g77VB2dFB/p0U5u335AD7UEji4QQ='
          names=('CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID','CF_ACCESS_CLIENT_ID','CF_ACCESS_CLIENT_SECRET','BESZEL_ACCESS_CLIENT_ID','BESZEL_ACCESS_CLIENT_SECRET','TELEGRAM_BOT_TOKEN','TELEGRAM_CHAT_ID')
          box=SealedBox(PublicKey(base64.b64decode(public_key)))
          sealed={}
          for name in names:
              value=os.environ.get(name,'')
              if not value: raise SystemExit('Required existing deployment credential is absent: '+name)
              target=name if name.startswith('CLOUDFLARE_') else 'UPTIMEFLARE_'+name
              sealed[target]=base64.b64encode(box.encrypt(value.encode())).decode('ascii')
          path=Path(os.environ['RUNNER_TEMP'])/'sealed-deploy-secrets.json'
          path.write_text(json.dumps({'recipient':recipient,'key_id':key_id,'encrypted_values':sealed}),encoding='utf-8')
          path.chmod(0o600)
          print('Credentials sealed to the destination GitHub key; plaintext was not printed or uploaded.')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sealed-central-deploy-secrets
          path: ${{ runner.temp }}/sealed-deploy-secrets.json
          retention-days: 1
          if-no-files-found: error
